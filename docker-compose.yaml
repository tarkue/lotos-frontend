services:
  frontend:
    build:
      context: .
      args:
        BACKEND_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    environment:
      SERVER_API_URL: http://api:8000/api
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: deploy/timeweb
    environment:
      ENV: production
      DEBUG: "false"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ai_classes}
      DB_USER: ${DB_USER:-ai_classes}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Timeweb}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in Timeweb}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Timeweb}
      PASSWORD_RESET_URL: https://zhendos.ru/profile/reset-password
      TIMEWEB_AGENT_ACCESS_ID: ${TIMEWEB_AGENT_ACCESS_ID:-demo}
      TIMEWEB_API_KEY: ${TIMEWEB_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_classes}
      POSTGRES_USER: ${DB_USER:-ai_classes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Timeweb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 4s
      retries: 15
